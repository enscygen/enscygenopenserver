<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KAU MycoGuide | Mushroom Expert</title>
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --primary: #1b5e20; 
            --primary-container: #e8f5e9;
            --secondary: #4e342e;
            --background: #fdfdfd;
            --surface: #ffffff;
            --text-main: #1b1c1b;
            --text-sub: #5f635f;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-lg: 28px;
            --radius-md: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--background);
            color: var(--text-main);
            height: 100vh;
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--surface);
            padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 100;
            border-bottom: 1px solid #f0f0f0;
        }

        .header-brand { display: flex; align-items: center; gap: 12px; }
        .header-brand img { width: 36px; height: 36px; object-fit: contain; }
        .header-title h1 { font-size: 18px; margin: 0; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
        .header-title p { font-size: 10px; margin: 0; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-sub); font-weight: 500; }

        .lang-toggle {
            background: var(--primary-container);
            color: var(--primary);
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        main { flex: 1; overflow-y: auto; padding-bottom: 90px; }
        .view { display: none; animation: slideIn 0.4s ease-out; }
        .view.active { display: block; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .home-hero {
            padding: 24px 16px;
            background: linear-gradient(135deg, var(--primary), #388e3c);
            color: white;
            border-radius: 0 0 32px 32px;
            margin-bottom: 24px;
        }

        .mushroom-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 0 16px; }
        .mushroom-card {
            background: var(--surface); border-radius: var(--radius-md); overflow: hidden;
            box-shadow: var(--shadow-sm); cursor: pointer; border: 1px solid #f0f0f0;
        }
        .card-img { width: 100%; height: 130px; background-size: cover; background-position: center; }
        .card-content { padding: 12px; }
        .card-content h3 { margin: 0; font-size: 15px; font-weight: 600; }

        .gallery-container { position: relative; background: #eee; }
        .gallery-scroller { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 280px; }
        .gallery-scroller::-webkit-scrollbar { display: none; }
        .gallery-item { flex: 0 0 100%; scroll-snap-align: center; background-size: cover; background-position: center; }

        .back-btn {
            position: absolute; top: 16px; left: 16px;
            background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-md); z-index: 50; backdrop-filter: blur(8px);
        }

        .detail-body {
            padding: 24px 20px; background: var(--surface); border-radius: 32px 32px 0 0;
            margin-top: -32px; position: relative; z-index: 5;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
        }

        .mushroom-intro {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-sub);
            margin: 16px 0;
            padding: 16px;
            background: #f8fcf8;
            border-radius: 16px;
            border-left: 5px solid var(--primary);
        }

        .video-wrapper {
            width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px;
            margin: 16px 0 24px; overflow: hidden; box-shadow: var(--shadow-md);
        }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }

        .info-pill-container { display: flex; overflow-x: auto; gap: 8px; padding: 4px 0 16px; scrollbar-width: none; }
        .info-pill {
            flex-shrink: 0; background: var(--primary-container); padding: 8px 14px;
            border-radius: 12px; font-size: 12px; color: var(--primary); font-weight: 600;
            display: flex; align-items: center; gap: 6px;
        }

        .variety-scroller { display: flex; overflow-x: auto; gap: 16px; padding: 8px 4px 24px; scrollbar-width: none; }
        .variety-card {
            flex: 0 0 160px; background: white; border-radius: 18px; padding: 10px;
            box-shadow: var(--shadow-sm); text-align: center; border: 1px solid #f0f0f0;
        }
        .variety-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 12px; margin-bottom: 8px; }

        .step-item { position: relative; padding-left: 44px; margin-bottom: 32px; }
        .step-item::before {
            content: ''; position: absolute; left: 15px; top: 32px; bottom: -32px; width: 2px; background: #e0e0e0;
        }
        .step-item:last-child::before { display: none; }
        .step-marker {
            position: absolute; left: 0; top: 0; width: 32px; height: 32px;
            background: var(--primary); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 14px; z-index: 2;
            box-shadow: 0 0 0 4px var(--primary-container);
        }

        .sub-steps { background: #f9faf9; border-radius: 16px; padding: 16px; margin-top: 12px; }
        .sub-step-item { display: flex; gap: 8px; margin-bottom: 8px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000;
            display: none; align-items: flex-end; justify-content: center;
            backdrop-filter: blur(6px);
        }
        .modal-content {
            background: white; width: 100%; max-width: 500px;
            border-radius: 32px 32px 0 0; padding: 28px;
            max-height: 90vh; overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        nav.bottom-nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; padding: 12px 0 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05); z-index: 100;
            border-top: 1px solid #f0f0f0;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sub); text-decoration: none; flex: 1; transition: var(--transition); }
        .nav-item span.material-symbols-rounded { padding: 6px 20px; border-radius: 20px; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active span.material-symbols-rounded { background-color: var(--primary-container); font-variation-settings: 'FILL' 1; }
        .nav-label { font-size: 11px; font-weight: 600; margin-top: 4px; }

        .section-header { display: flex; align-items: center; justify-content: space-between; margin: 32px 0 16px; }
        .section-title { font-size: 19px; font-weight: 700; color: var(--secondary); margin: 0; }
        .p-16 { padding: 16px; }
    </style>
</head>

        function updateUI() {
            const s = uiStrings[currentLang];
            document.getElementById('header-subtitle').innerText = s.subtitle;
            document.getElementById('welcome-msg').innerText = s.welcome;
            document.getElementById('welcome-sub').innerText = s.welcomeSub;
            document.getElementById('search-placeholder').placeholder = s.search;
            document.getElementById('popular-title').innerText = s.popular;
            document.getElementById('library-title').innerText = s.library;
            document.getElementById('library-sub').innerText = s.libSub;
            document.getElementById('about-location').innerText = s.loc;
            document.getElementById('lang-btn-text').innerText = s.langBtn;
            
            document.getElementById('label-home').innerText = s.home;
            document.getElementById('label-learn').innerText = s.learn;
            document.getElementById('label-inst').innerText = s.inst;
            
            renderData();
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'en') ? 'ml' : 'en';
            updateUI();
        }

        function renderData() {
            const grid = document.getElementById('home-grid');
            const cult = document.getElementById('cult-list');
            const s = uiStrings[currentLang];
            
            grid.innerHTML = mushrooms.map(m => `
                <div class="mushroom-card" onclick="openDetail(${m.id})">
                    <div class="card-img" style="background-image: url('${m.gallery[0]}')"></div>
                    <div class="card-content">
                        <h3>${m[currentLang].name}</h3>
                        <small>${m[currentLang].scientific}</small>
                    </div>
                </div>
            `).join('');

            cult.innerHTML = mushrooms.map(m => `
                <div style="background:white; display:flex; align-items:center; gap:16px; padding:16px; border-radius:18px; margin-bottom:16px; box-shadow:var(--shadow-sm); border:1px solid #f0f0f0;" onclick="openDetail(${m.id}, 'steps')">
                    <img src="${m.gallery[0]}" style="width:60px; height:60px; border-radius:12px; object-fit:cover;">
                    <div style="flex:1">
                        <h4 style="margin:0; font-size:16px;">${m[currentLang].name}</h4>
                        <small style="color:var(--text-sub)">${m[currentLang].steps.length} ${s.steps}</small>
                    </div>
                    <span class="material-symbols-rounded" style="color:var(--primary)">arrow_forward_ios</span>
                </div>
            `).join('');
        }

        function openDetail(id, section = null) {
            const m = mushrooms.find(x => x.id === id);
            const detail = document.getElementById('view-detail');
            const langData = m[currentLang];
            const s = uiStrings[currentLang];
            
            const videoBlock = m.videoUrl ? `
                <div class="section-header"><h2 class="section-title">${s.video}</h2></div>
                <div class="video-wrapper"><iframe src="${m.videoUrl}" allowfullscreen></iframe></div>
            ` : '';

            detail.innerHTML = `
                <div class="gallery-container">
                    <button class="back-btn" onclick="switchView('home')"><span class="material-symbols-rounded">arrow_back</span></button>
                    <div class="gallery-scroller">${m.gallery.map(img => `<div class="gallery-item" style="background-image:url('${img}')"></div>`).join('')}</div>
                </div>
                <div class="detail-body">
                    <h1 style="margin:0; font-size:26px;">${langData.name}</h1>
                    <p style="color:var(--primary); font-style:italic; margin:4px 0 20px;">${langData.scientific}</p>
                    <div class="info-pill-container">
                        <div class="info-pill"><span>scale</span>${s.yield}: ${m.meta.yield}</div>
                        <div class="info-pill"><span>thermostat</span>${s.temp}: ${m.meta.temp}</div>
                        <div class="info-pill"><span>eco</span>${s.substrate}: ${m.meta.substrate}</div>
                    </div>

                    <div class="mushroom-intro">${langData.intro}</div>

                    ${videoBlock}
                    <div class="section-header"><h2 class="section-title">${s.varieties}</h2></div>
                    <div class="variety-scroller">
                        ${langData.varieties.map(v => `
                            <div class="variety-card" onclick="openVarietyModal('${v.name}', '${v.img}', '${v.info}')">
                                <img src="${v.img}"><span>${v.name}</span>
                            </div>
                        `).join('')}
                    </div>
                    <div class="section-header" id="steps-anchor"><h2 class="section-title">${s.steps}</h2></div>
                    <div class="step-container">
                        ${langData.steps.map((step, i) => `
                            <div class="step-item">
                                <div class="step-marker">${i+1}</div>
                                <h3 style="margin:0 0 8px; font-size:18px;">${step.title}</h3>
                                <div class="sub-steps">
                                    ${step.subSteps.map(sub => `
                                        <div class="sub-step-item">
                                            <div style="color:var(--primary); font-size:18px; line-height:1;">•</div>
                                            <div>
                                                <strong>${sub.head}</strong>
                                                <div style="color:var(--text-sub); font-size:14px;">${sub.text}</div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            switchView('detail');
            if(section === 'steps') setTimeout(() => document.getElementById('steps-anchor').scrollIntoView({behavior:'smooth'}), 400);
        }

        function openVarietyModal(name, img, info) {
            const overlay = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            const s = uiStrings[currentLang];
            body.innerHTML = `
                <div style="text-align:center;"><img src="${img}" style="width:100%; border-radius:24px; aspect-ratio:4/3; object-fit:cover; margin-bottom:20px;">
                <h2 style="margin:0; font-size:24px; color:var(--primary)">${name}</h2></div>
                <p style="color:var(--text-sub); line-height:1.6; font-size:16px; margin:16px 0 24px;">${info}</p>
                <button onclick="closeModal()" style="width:100%; padding:16px; background:var(--primary); color:white; border:none; border-radius:16px; font-weight:700;">${s.gotit}</button>
            `;
            overlay.style.display = 'flex';
        }

        function switchView(viewId, event) {
            if (event) event.preventDefault();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            const target = document.getElementById(`view-${viewId}`);
            if (target) target.classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const nav = document.getElementById(`nav-${viewId}`);
            if(nav) nav.classList.add('active');
            document.querySelector('main').scrollTop = 0;
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
        window.onclick = (e) => { if(e.target.id == 'modal-overlay') closeModal(); }
        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
